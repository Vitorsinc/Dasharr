name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Identificador de Dasharr ante Google (inicio de sesión para la copia en Drive): ver docs/google.md.
env:
  DASHARR_GOOGLE_CLIENT_ID: ${{ secrets.DASHARR_GOOGLE_CLIENT_ID }}
  DASHARR_GOOGLE_CLIENT_SECRET: ${{ secrets.DASHARR_GOOGLE_CLIENT_SECRET }}

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: cargo test -p dasharr-core

  windows:
    name: Instalador de Windows
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # Las compilaciones de CI son «Dasharr Dev»: otro nombre e identificador, así que se instalan junto a
      # Dasharr (las versiones publicadas salen de release.yml, sin este archivo).
      - run: npx tauri build --config src-tauri/tauri.dev.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: dasharr-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  android:
    name: APK de Android
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - run: npm ci
      # Como en Windows, CI compila «Dasharr Dev», que se instala junto a Dasharr.
      - name: Compilar la APK
        env:
          DASHARR_ANDROID_DEV: "1"
          DASHARR_ANDROID_KEYSTORE: ${{ secrets.DASHARR_ANDROID_KEYSTORE }}
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dasharr-android
          path: dist-android/*
          if-no-files-found: error

  # Versión de prueba: con cada cambio que entra en dev se vuelve a publicar la Release «dev-latest»
  # (marcada como prerelease, así que la versión estable sigue mirando solo las publicadas).
  # Las instalaciones que siguen el canal dev la detectan y se actualizan solas.
  dev-release:
    name: Publicar versión de prueba (dev)
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dasharr-windows
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: dasharr-android
          path: build-android
      - name: Sustituir la Release «dev-latest» por esta compilación
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          exe=$(find build -name '*-setup.exe' | head -n1)
          test -n "$exe"
          sha256sum "$exe" | cut -d' ' -f1 > "$exe.sha256"
          short=${GITHUB_SHA::7}
          { echo "Versión de prueba de la rama dev (commit $short)."; echo; echo "Último cambio:"; echo; echo "$MESSAGE"; } > notes.md
          # «dev» era el nombre anterior: se quita porque la etiqueta chocaba con la rama dev.
          gh release delete dev --cleanup-tag --yes || true
          gh release delete dev-latest --cleanup-tag --yes || true
          # Esperar a que la etiqueta antigua desaparezca antes de crearla de nuevo en este commit.
          for i in 1 2 3 4 5 6; do gh api "repos/$GH_REPO/git/refs/tags/dev-latest" >/dev/null 2>&1 || break; sleep 5; done
          apk=$(find build-android -name '*_android.apk' | head -n1)
          test -n "$apk"
          gh release create dev-latest "$exe" "$exe.sha256" "$apk" "$apk.sha256" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Dasharr Dev ($short)" --notes-file notes.md
