name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Identificador de Dasharr ante Google (inicio de sesión para la copia en Drive): ver docs/google.md.
env:
  DASHARR_GOOGLE_CLIENT_ID: ${{ secrets.DASHARR_GOOGLE_CLIENT_ID }}
  DASHARR_GOOGLE_CLIENT_SECRET: ${{ secrets.DASHARR_GOOGLE_CLIENT_SECRET }}

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: cargo test -p dasharr-core

  windows:
    name: Instalador de Windows
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # el número de la versión de prueba es el número de commits
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # Las compilaciones de CI son «Dasharr Dev»: otro nombre e identificador, así que se instalan junto a
      # Dasharr (las versiones publicadas salen de release.yml, sin este archivo).
      - run: npx tauri build --config src-tauri/tauri.dev.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: dasharr-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  android:
    name: APK de Android
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # el número de la versión de prueba es el número de commits
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - run: npm ci
      # Como en Windows, CI compila «Dasharr Dev», que se instala junto a Dasharr.
      - name: Compilar la APK
        env:
          DASHARR_ANDROID_DEV: "1"
          DASHARR_ANDROID_KEYSTORE: ${{ secrets.DASHARR_ANDROID_KEYSTORE }}
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dasharr-android
          path: dist-android/*
          if-no-files-found: error

  # Versión de prueba: con cada cambio que entra en dev se vuelve a publicar la Release «dev-latest»
  # (marcada como prerelease, así que la versión estable sigue mirando solo las publicadas).
  # Las instalaciones que siguen el canal dev la detectan y se actualizan solas.
  dev-release:
    name: Publicar versión de prueba (dev)
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dasharr-windows
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: dasharr-android
          path: build-android
      - name: Sustituir la Release «dev-latest» por esta compilación
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          exe=$(find build -name '*-setup.exe' | head -n1)
          test -n "$exe"
          sha256sum "$exe" | cut -d' ' -f1 > "$exe.sha256"
          short=${GITHUB_SHA::7}
          # El mismo número que llevan dentro las apps (vite.config.ts): commits de la rama hasta aquí.
          number=$(git rev-list --count HEAD)
          { echo "Versión de prueba $number de la rama dev (commit $short)."; echo; echo "Último cambio:"; echo; echo "$MESSAGE"; } > notes.md
          # «dev» era el nombre anterior: se quita porque la etiqueta chocaba con la rama dev.
          gh release delete dev --cleanup-tag --yes || true
          # Quitar la Release dev-latest anterior (también si quedó como borrador) y su etiqueta.
          for id in $(gh api "repos/$GH_REPO/releases?per_page=50" --jq '.[] | select(.tag_name == "dev-latest") | .id'); do
            gh api -X DELETE "repos/$GH_REPO/releases/$id"
          done
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/dev-latest" >/dev/null 2>&1 || true
          # Esperar a que la etiqueta antigua desaparezca antes de crearla de nuevo en este commit.
          for i in 1 2 3 4 5 6; do gh api "repos/$GH_REPO/git/ref/tags/dev-latest" >/dev/null 2>&1 || break; sleep 5; done
          apk=$(find build-android -name '*_android.apk' | head -n1)
          test -n "$apk"
          # Primero la etiqueta y la Release sin archivos, y luego se suben. Con los archivos en el mismo
          # «gh release create», gh la crea como borrador para subirlos y a veces se queda así: un borrador
          # no se ve sin sesión, así que Dasharr Dev no encontraba la actualización.
          # --target: sin él la Release apunta a «master», y las Dasharr Dev de antes (que comparan el commit) no la ven.
          gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/dev-latest -f sha="$GITHUB_SHA" >/dev/null
          gh release create dev-latest --verify-tag --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Dasharr Dev $number" --notes-file notes.md
          # La suma SHA-256 se sube la última: hasta entonces la app no ofrece la actualización a medias.
          gh release upload dev-latest "$exe" "$apk"
          gh release upload dev-latest "$exe.sha256" "$apk.sha256"
          draft=$(gh api "repos/$GH_REPO/releases/tags/dev-latest" --jq .draft)
          test "$draft" = "false" || { echo "La Release dev-latest ha quedado como borrador"; exit 1; }
