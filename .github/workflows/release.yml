name: Release

on:
  push:
    tags: ["v*"]
  # También se puede lanzar a mano desde Actions (o por la API) indicando la versión;
  # entonces crea la etiqueta vX.Y.Z sobre el commit elegido al publicar la Release.
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar, sin la v (por ejemplo 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  # La APK de Android se compila aparte (en Linux) y la publica el trabajo de Windows junto al instalador.
  android:
    runs-on: ubuntu-latest
    env:
      DASHARR_RELEASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - run: npm ci
      - name: Compilar la APK
        env:
          DASHARR_ANDROID_KEYSTORE: ${{ secrets.DASHARR_ANDROID_KEYSTORE }}
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dasharr-android
          path: dist-android/*
          if-no-files-found: warn

  release:
    runs-on: windows-latest
    needs: android
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
      # Marca la compilación como versión publicada aunque se lance a mano (sin etiqueta): sin "· dev abc1234".
      DASHARR_RELEASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Comprobar versión y preparar notas
        shell: bash
        run: |
          node scripts/release-notes.mjs "$TAG" > notes.md
      - name: Compilar el instalador
        run: npx tauri build
      # Lo que se firma (y se publica) sale de aquí: SignPath solo acepta artefactos subidos por GitHub Actions.
      - uses: actions/upload-artifact@v4
        id: unsigned
        with:
          name: dasharr-sin-firmar
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
      # Firma gratuita de SignPath Foundation (ver README → Code signing policy). Se activa sola cuando
      # existen la variable SIGNPATH_ORGANIZATION_ID y el secreto SIGNPATH_API_TOKEN; sin ellos se publica
      # sin firmar, como hasta ahora. Cada firma se aprueba a mano en signpath.io: el paso espera hasta 3 h.
      - name: Firmar con SignPath (espera a que se apruebe en signpath.io)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'dasharr' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: signed
      - name: Reunir los instaladores a publicar
        shell: bash
        run: |
          mkdir -p dist-release
          if [ -d signed ]; then
            find signed -type f \( -name '*-setup.exe' -o -name '*.msi' \) -exec cp {} dist-release/ \;
          else
            echo "::warning::Sin SignPath configurado: se publica sin firmar."
            cp target/release/bundle/nsis/*-setup.exe target/release/bundle/msi/*.msi dist-release/
          fi
          ls -l dist-release
          test -n "$(ls dist-release/*-setup.exe)"
          # La suma SHA-256 la usa la actualización automática: se calcula sobre el instalador ya firmado.
          for exe in dist-release/*-setup.exe; do sha256sum "$exe" | cut -d' ' -f1 > "$exe.sha256"; done
      - uses: actions/download-artifact@v4
        continue-on-error: true # no hay APK si falta la firma de Android
        with:
          name: dasharr-android
          path: dist-release
      - name: Publicar la Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" dist-release/* --target "$GITHUB_SHA" \
            --title "Dasharr $TAG" --notes-file notes.md --latest
