name: Release

on:
  push:
    tags: ["v*"]
  # También se puede lanzar a mano desde Actions (o por la API) indicando la versión;
  # entonces crea la etiqueta vX.Y.Z sobre el commit elegido al publicar la Release.
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar, sin la v (por ejemplo 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Comprobar versión y preparar notas
        id: notes
        shell: bash
        run: |
          node scripts/release-notes.mjs "$TAG" > notes.md
          { echo "body<<EOF"; cat notes.md; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Dasharr ${{ env.TAG }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
      - name: Publicar la suma SHA-256 del instalador (la usa la actualización automática)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exe=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          sha256sum "$exe" | cut -d' ' -f1 > "$exe.sha256"
          gh release upload "$TAG" "$exe.sha256" --clobber
